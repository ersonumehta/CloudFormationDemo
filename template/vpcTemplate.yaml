AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC Template - VPC, Subnets, Gateways, Route Tables, and Security Groups'

Parameters:
  EnvironmentName:
    Type: String
    Default: Dev
    Description: Environment name prefix

  ServiceName:
    Type: String
    Default: UserSetting
    Description: Service name for the application

  EnvIdentifier:
    Type: String
    Default: q1w
    Description: Environment identifier

  CreateBucketIfNotExists:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create the S3 bucket only if it doesn't exist

Conditions:
  ShouldCreateBucket: !Equals [ !Ref CreateBucketIfNotExists, 'true' ]

Resources:
   # ============================================================
   # S3 Bucket
   # ============================================================
  TestBucketForReport:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBucket
    Properties:
       BucketName: skmehtausatestbucketforreport-73483638381
       VersioningConfiguration:
         Status: Enabled
       PublicAccessBlockConfiguration:
         BlockPublicAcls: true
         BlockPublicPolicy: true
         IgnorePublicAcls: true
         RestrictPublicBuckets: true
       Tags:
         - Key: Name
           Value: !Sub '${EnvironmentName}-${ServiceName}-${EnvIdentifier}-TestBucket'
         - Key: Environment
           Value: !Ref EnvironmentName
         - Key: Service
           Value: !Ref ServiceName

Outputs:
  S3BucketNameNew:
    Description: S3 Bucket Name
    Value: !If
      - ShouldCreateBucket
      - !Ref TestBucketForReport
      - 'skmehtausatestbucketforreport-73483638381'  # Hardcoded bucket name when not creating
    Export:
      Name: !Sub '${EnvironmentName}-${ServiceName}-${EnvIdentifier}-S3Bucket-Name-New'
    Condition: ShouldCreateBucket

